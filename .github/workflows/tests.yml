name: Перевірки моделі

on:
  push:
  pull_request:

jobs:
  verify:
    name: Python 3.12 — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Встановити залежності симулятора
        run: python -m pip install -r requirements.txt
      - name: Перевірити правила моделі
        run: python tools/run_tests.py
      - name: Перевірити посилання та походження
        run: python tools/verify_repository.py
      - name: Встановити залежності перевірки збережених таблиць
        run: python -m pip install numpy==2.3.1 pandas==2.3.1
      - name: Перевірити завершену серію без перенавчання
        run: python tools/verify_conditions_study.py --output results/conditions_contract_ml_2026_11_07
